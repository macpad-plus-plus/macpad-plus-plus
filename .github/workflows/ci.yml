name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check translation files are up to date
        run: python3 -I scripts/update-translations.py --check

      - name: Test
        run: |
          xcodebuild -project MacPad.xcodeproj -scheme MacPad -configuration Debug \
            -destination "platform=macOS" CODE_SIGN_IDENTITY=- test
