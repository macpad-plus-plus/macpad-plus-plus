name: Release

# Pushing a tag such as v0.1.0 builds the DMG and publishes a GitHub Release.
# The tag must match MARKETING_VERSION in project.yml, and CHANGELOG.md should
# have a "## [0.1.0]" section, used as the release notes.
#
# Signing and notarization are optional. Without these repository secrets the
# app is ad-hoc signed and the release notes explain how to open it:
#   DEVELOPER_ID_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  password of that .p12
#   DEVELOPER_ID_APPLICATION           identity, e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID                      Team ID
#   APPLE_ID, APPLE_APP_PASSWORD       Apple ID and app-specific password for notarytool

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check tag against project version
        id: version
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build DMGs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          scripts/build-dmg.sh apple-silicon
          scripts/build-dmg.sh universal

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "### Download"
            echo
            echo "| Your Mac | Download |"
            echo "|---|---|"
            echo "| Apple silicon (M1 or later) | **MacPad++-$VERSION-apple-silicon.dmg** (smaller) |"
            echo "| Intel, or not sure | **MacPad++-$VERSION-universal.dmg** (runs on any Mac) |"
            echo
            echo "To check: Apple menu ▸ About This Mac shows *Chip* (Apple silicon) or *Processor* (Intel)."
            echo "Open the DMG and drag MacPad++ to Applications. Requires macOS 14 or later."
            if [[ "$HAS_SIGNING" != "true" ]]; then
              echo
              echo "This build is not notarized by Apple yet. The first time, macOS will refuse to open it:"
              echo "open **System Settings ▸ Privacy & Security** and click **Open Anyway** next to MacPad++,"
              echo 'or run `xattr -dr com.apple.quarantine /Applications/MacPad++.app` in Terminal.'
            fi
          } >> "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MacPad++-$VERSION-apple-silicon.dmg" "dist/MacPad++-$VERSION-apple-silicon.dmg.sha256" \
            "dist/MacPad++-$VERSION-universal.dmg" "dist/MacPad++-$VERSION-universal.dmg.sha256" \
            --title "MacPad++ $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
